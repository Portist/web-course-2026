<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быки и коровы</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="container">
    <h1>Быки и коровы</h1>
    <div class="rules">
        <p><strong>Правила:</strong> Компьютер загадал число из 4 неповторяющихся цифр от 0 до 9. Попробуйте его угадать!</p>
        <ul>
            <li><strong>Бык:</strong> цифра угадана и стоит на своём месте.</li>
            <li><strong>Корова:</strong> цифра есть в загаданном числе, но стоит на другом месте.</li>
        </ul>
    </div>

    <div class="game-controls">
        <input type="text" id="guess-input" placeholder="Введите 4 цифры" maxlength="4" autocomplete="off">
        <button id="check-btn">Проверить</button>
        <button id="new-game-btn" class="secondary">Новая игра</button>
    </div>

    <div id="message" class="message"></div>

    <div class="stats">
        <p>Количество попыток: <span id="attempts-count">0</span></p>
    </div>

    <ul id="history-list" class="history-list"></ul>
</div>
</body>
</html>
