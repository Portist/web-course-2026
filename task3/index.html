<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<main class="todo">
    <h1>Список задач</h1>

    <form id="todo-form" class="todo-form">
        <input
                id="todo-input"
                type="text"
                placeholder="Введите задачу..."
                autocomplete="off"
        >
        <button type="submit">Добавить</button>
    </form>

    <p id="counter" class="counter">
        Осталось: 0, Выполнено: 0
    </p>

    <div class="filters">
        <button type="button" class="filter active" data-filter="all">
            Все
        </button>

        <button type="button" class="filter" data-filter="active">
            Активные
        </button>

        <button type="button" class="filter" data-filter="completed">
            Завершённые
        </button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
</main>

</body>
</html>
